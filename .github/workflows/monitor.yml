name: Bina.az Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:        # Allows manual run from GitHub UI

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # CRITICAL: Allows Git to commit seen.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Monitor Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Do NOT set GH_TOKEN or GH_REPO here. Let Git push handle it below.
        run: python main.py

      - name: Commit and push updated seen.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "chore: auto-update historical seen.json [skip ci]" && git push)
