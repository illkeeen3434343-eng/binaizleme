name: Scrape and Update History

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours (adjust as needed)
  workflow_dispatch:       # Allows manual triggering from GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Grants write access to commit seen.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python script
        run: python main.py

      - name: Commit and push updated seen.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "chore: update historical seen.json [skip ci]" && git push)
